<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Garden</title>

<style>
*{ box-sizing:border-box; }
:root{
  --cream:#FAF6EC; --ink:#3E3A2E; --sage:#7C9070; --sage-dark:#5C6E52;
  --coral:#E3906A; --tile:#FFFFFF; --tile-border:#D9D2BF; --shadow:rgba(62,58,46,0.15);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --cream:#2B2A24; --ink:#F1ECDD; --sage:#8FA382; --sage-dark:#B7C6AC; --coral:#F0A87E; --tile:#3A382F; --tile-border:#55503F; --shadow:rgba(0,0,0,0.4); }
}
:root[data-theme="dark"]{ --cream:#2B2A24; --ink:#F1ECDD; --sage:#8FA382; --sage-dark:#B7C6AC; --coral:#F0A87E; --tile:#3A382F; --tile-border:#55503F; --shadow:rgba(0,0,0,0.4); }
:root[data-skin="ocean"]{ --sage:#5B8FA8; --sage-dark:#3F6E86; --coral:#E8A05C; }
:root[data-skin="sunset"]{ --sage:#C9785A; --sage-dark:#9A4F36; --coral:#7A6FA8; }
:root[data-skin="lavender"]{ --sage:#8E7CB5; --sage-dark:#6B5A93; --coral:#E38FA8; }
@media (prefers-color-scheme: dark){
  :root[data-skin="ocean"]:not([data-theme="light"]){ --sage-dark:#A9CBDD; }
  :root[data-skin="sunset"]:not([data-theme="light"]){ --sage-dark:#E6B7A3; }
  :root[data-skin="lavender"]:not([data-theme="light"]){ --sage-dark:#CBBFE3; }
}
html,body{min-height:100%; margin:0;}
@supports (min-height:100dvh){ html,body{ min-height:100dvh; } }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  background:var(--cream); color:var(--ink); font-family:Georgia,'Iowan Old Style',serif; display:flex; justify-content:center; overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px);
}
.app{width:100%; max-width:480px; min-height:100%; padding:18px 16px 32px; display:flex; flex-direction:column; align-items:center;}
h1{font-size:clamp(24px,7vw,30px); margin:2px 0 8px; font-weight:400; text-align:center;}
.topRow{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; margin-bottom:8px;}
.coins{font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:15px; font-weight:700; background:var(--tile); border:2px solid var(--tile-border); border-radius:20px; padding:6px 12px; color:var(--ink);}
.diffrow{display:flex; flex-wrap:wrap; justify-content:center; gap:8px;}
.diffrow button{font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:14px; font-weight:600; padding:8px 14px; border-radius:20px; border:2px solid var(--tile-border); background:var(--tile); color:var(--ink); cursor:pointer;}
.diffrow button.active{background:var(--sage); border-color:var(--sage-dark); color:#FFFDF8;}
.newBtn{width:36px; height:36px; border-radius:50%; border:2px solid var(--tile-border); background:var(--tile); color:var(--ink); font-size:20px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;}
.progress{font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:14px; color:var(--sage-dark); margin-bottom:12px; text-align:center;}
.gridwrap{width:100%; display:flex; justify-content:center; overflow-x:auto; margin-bottom:10px;}
.grid{display:grid; gap:4px; margin:0 auto;}
.cell{border:2px solid var(--tile-border); border-radius:6px; background:var(--tile); display:flex; align-items:center; justify-content:center; font-weight:700; color:var(--ink); transition:background .2s,transform .2s;}
.cell.revealed{background:var(--sage); border-color:var(--sage-dark); color:#FFFDF8; transform:scale(1.03);}
.cell.hinted{background:var(--cream); border-color:var(--coral); border-style:dashed; color:var(--coral);}
.cell.pop{ animation:popIn .3s ease; }
@keyframes popIn{ 0%{transform:scale(0.3); opacity:0.3;} 55%{transform:scale(1.18);} 100%{transform:scale(1.03); opacity:1;} }
.bonus{font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:16px; color:var(--sage-dark); min-height:20px; margin-bottom:6px; text-align:center;}
.message{font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:18px; font-weight:600; color:var(--coral); min-height:24px; margin-bottom:6px; text-align:center;}
.wheelbox{position:relative; margin:10px auto 6px; touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
.wheelbox svg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
.wheelInner{position:absolute; inset:0;}
.wheelInner.spin{ animation: spinWheel .4s ease; }
@keyframes spinWheel{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
.letter{position:absolute; border-radius:50%; border:none; background:var(--sage); color:#FFFDF8; font-weight:700; font-family:-apple-system,Segoe UI,Roboto,sans-serif; box-shadow:0 4px 10px var(--shadow); display:flex; align-items:center; justify-content:center;}
.letter.active{background:var(--coral); transform:scale(1.1);}
.cornerBtn{position:absolute; width:42px; height:42px; border-radius:50%; border:none; background:var(--tile); color:var(--ink); font-size:20px; box-shadow:0 3px 8px var(--shadow); cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:3;}
.cornerBtn.disabled{opacity:0.35; pointer-events:none;}
#shuffleBtn{ top:-8px; left:-8px; }
#hintBtn{ top:-8px; right:-8px; }
.overlay{position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; padding:20px; z-index:10;}
.overlay.hidden{display:none;}
.card{background:var(--cream); border-radius:18px; padding:30px 24px; text-align:center; max-width:320px; max-height:85vh; max-height:85dvh; overflow-y:auto; box-shadow:0 12px 30px var(--shadow);}
.card h2{margin:0 0 8px; font-size:24px; font-weight:400;}
.card p{font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:15px; color:var(--sage-dark); margin:0 0 18px;}
.card button{font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:17px; font-weight:600; padding:12px 26px; border-radius:12px; border:none; background:var(--sage); color:#fff; cursor:pointer;}
.card input[type=text]{font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:16px; padding:10px 12px; border-radius:10px; border:2px solid var(--tile-border); width:100%; margin-bottom:14px; background:var(--tile); color:var(--ink);}
.coins{cursor:pointer;}
.shopList{display:flex; flex-direction:column; gap:10px; margin-bottom:12px; text-align:left;}
.shopRow{display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--tile); border:2px solid var(--tile-border); border-radius:12px; padding:10px 12px; font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
.shopRow .t{font-weight:700; font-size:15px;}
.shopRow .d{font-size:12px; opacity:.75;}
.card .shopRow button{padding:8px 12px; font-size:14px; white-space:nowrap;}
.card .shopRow button:disabled{opacity:.45;}
.shopMsg{font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:14px; color:var(--coral); min-height:20px; margin-bottom:10px;}
.card .row{display:flex; gap:10px; justify-content:center;}
.card button.secondary{background:var(--tile); color:var(--ink); border:2px solid var(--tile-border);}
.mpStatus{font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:13px; color:var(--sage-dark); min-height:16px; margin:-6px 0 8px; text-align:center;}
.hidden{display:none !important;}
.pickList{display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
.pickList button{width:100%;}
.chatPanel{position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto; background:var(--tile); border-top:2px solid var(--tile-border); border-radius:16px 16px 0 0; box-shadow:0 -6px 20px var(--shadow); z-index:8; display:flex; flex-direction:column; max-height:50vh; max-height:50dvh;}
.chatMessages{flex:1; overflow-y:auto; padding:10px 14px; font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:14px;}
.chatLine{margin-bottom:6px; color:var(--ink);}
.chatInputRow{display:flex; gap:8px; padding:10px 12px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--tile-border);}
.chatInputRow input{flex:1; font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:15px; padding:8px 12px; border-radius:20px; border:2px solid var(--tile-border); background:var(--cream); color:var(--ink);}
.chatInputRow button{font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-weight:600; padding:8px 16px; border-radius:20px; border:none; background:var(--sage); color:#fff; cursor:pointer;}
</style>
</head>
<body>
<div class="app">
  <h1>Word Garden</h1>
  <div class="topRow">
    <div class="coins" id="coinPill" title="Shop">🪙 <span id="coinCount">0</span> 🛍️</div>
    <div class="diffrow" id="diffrow">
      <button data-d="easy">Easy</button>
      <button data-d="medium">Medium</button>
      <button data-d="hard">Hard</button>
    </div>
    <button class="newBtn" id="newBtn" title="New puzzle">+</button>
    <button class="newBtn hidden" id="mpBtn" title="Play together">🎮</button>
    <button class="newBtn hidden" id="chatToggle" title="Chat">💬</button>
    <button class="newBtn hidden" id="leaveRoomBtn" title="Leave shared game">👋</button>
  </div>
  <div class="mpStatus" id="mpStatus">&nbsp;</div>
  <div class="progress" id="progress"></div>
  <div class="gridwrap" id="gridwrap"><div class="grid" id="grid"></div></div>
  <div class="bonus" id="bonus">&nbsp;</div>
  <div class="message" id="message">&nbsp;</div>
  <div class="wheelbox" id="wheelbox">
    <svg id="line"><polyline id="poly" points="" stroke-width="6" stroke-linecap="round" fill="none"/></svg>
    <div class="wheelInner" id="wheelInner"></div>
    <button class="cornerBtn" id="shuffleBtn" title="Shuffle letters">🔀</button>
    <button class="cornerBtn" id="hintBtn" title="Hint">💡</button>
  </div>
</div>

<div class="overlay hidden" id="overlay">
  <div class="card">
    <h2>Well done!</h2>
    <p id="overlayText">You found every word in this garden.</p>
    <button id="overlayBtn">Next Garden</button>
  </div>
</div>

<div class="overlay hidden" id="coinOverlay">
  <div class="card">
    <h2>Not enough coins</h2>
    <p id="coinOverlayText">You need more coins for a hint.</p>
    <button id="coinOverlayBtn">OK</button>
  </div>
</div>

<div class="overlay hidden" id="shopOverlay">
  <div class="card">
    <h2>Shop</h2>
    <p id="shopCoins"></p>
    <div class="shopList" id="shopList"></div>
    <div class="shopMsg" id="shopMsg">&nbsp;</div>
    <button class="secondary" id="shopClose">Close</button>
  </div>
</div>

<div class="overlay hidden" id="nameOverlay">
  <div class="card">
    <h2>What's your name?</h2>
    <p>So the other player knows who's asking to play together.</p>
    <input type="text" id="nameInput" maxlength="20" placeholder="Your name">
    <button id="nameGo">Let's go</button>
  </div>
</div>

<div class="overlay hidden" id="pickOverlay">
  <div class="card">
    <h2>Who do you want to play with?</h2>
    <div class="pickList" id="pickList"></div>
    <button class="secondary" id="pickCancel">Cancel</button>
  </div>
</div>

<div class="overlay hidden" id="requestOverlay">
  <div class="card">
    <h2>Play together?</h2>
    <p id="reqText"></p>
    <div class="row">
      <button id="reqAccept">✓ Accept</button>
      <button class="secondary" id="reqDecline">✕ Not now</button>
    </div>
  </div>
</div>

<div class="chatPanel hidden" id="chatPanel">
  <div class="chatMessages" id="chatMessages"></div>
  <div class="chatInputRow">
    <input type="text" id="chatInput" maxlength="200" placeholder="Say something...">
    <button id="chatSend">Send</button>
  </div>
</div>

<script>
const SEED = ["garden","master","planet","silver","golden","castle","animal","flower","winter","summer","market","pocket","closet","candle","orange","purple","yellow","monkey","rabbit","turtle","dragon","wizard","wonder","forest","meadow","valley","bridge","tunnel","rocket","engine","hammer","ladder","pillow","kitchen","teacher","student","library","camera","guitar","thunder","lantern","compass","diamond","crystal","pirate","sailor","captain","island","jungle","desert","canyon","volcano","sunrise","sunset","morning","evening","holiday","weekend","present","balloon","cookie","pancake","pumpkin","cabbage","potato","cherry","banana","mango","feather","blanket","whisper","triangle","elephant","squirrel","mountain","umbrella","notebook","sandwich","backpack","painting","envelope","computer","keyboard","fountain","harvest","blossom","journey","freedom","treasure","sparkle","chimney","biscuit","popcorn","hallway","rainbow","village","cottage","chapter","journal","sticker","bracelet","necklace","sneaker","sweater","mitten","jacket","basket","bucket","shovel","orchard","carrot","lettuce","spinach","broccoli","avocado","coconut","sparrow","penguin","dolphin","octopus","giraffe","panther","leopard","buffalo","chicken","rooster","peacock","falcon","bedroom","bathroom","driveway","sidewalk","mailbox","doorbell","curtain","mattress","mirror","dresser","cabinet","drawer","shelves","weather","monsoon","drizzle","blizzard","tornado","autumn","spring","pencil","crayon","eraser","scissors","trumpet","violin","clarinet","speaker","concert","melody","rhythm","soccer","tennis","hockey","boxing","rowing","diving","skating","running","galaxy","meteor","saturn","jupiter","mercury","neptune","uranus"];
const SUPPORT = "cat car art rat tar arc cart top pot opt spot stop tops pots ear eat ate tea age rag ran red dear dare dean earn near grand one men lone mole melon lemon his sin she shin shine hat heat hear tear rate hate heart earth king ring sing wing pink link mint mine nine dine fine line lime hide bike bite kite site rice mice dice nice ice race face lace pace cane lane wave cave save gave pave rave grave rope hope rose nose pose lose dose hose tone bone cone zone gone none done sole pole role hole smoke spoke broke choke woke joke poke coke stone alone shore store snore score chore more core wore tore sore bore door food good wood look book cook took hook nook foot root boot loot moot soot mood moon noon room zoom loom boom doom gloom bloom groom broom plant part past fast last mast cast vast east feast beast least yeast toast roast coast boast ghost host most post cost lost frost flag glad grad brad clad dad mad sad bad lad pad fad had bag rag tag wag nag sag gag hag lag jag ant arm bay bed bee bet bid big bit box boy bug bun bus but buy cab can cap cop cow cry cub cup cut dam day den die dig dim dip dog dot dry due dug egg elm end era eye fan far fat fee few fig fin fit fix fly fog for fox fun fur gap gas gem get gum gun gut guy ham hen hey hid him hip hit hop hot how hub hug hut ink inn ion ivy jam jar jaw jet job jog joy jug key kid kit lab lad lap law lay leg let lid lie lip lit log lot low man map mat may mob mom mop mud mug nap net new nod nor not nut oak oar odd off oil old orb our out owl own pan pat paw pay pea pen pet pie pig pin pit pop pub pun put ram rap raw ray rib rid rig rim rip rob rod rot rub rug run rye sat saw say sea set sew shy sip sit six ski sky sly sob sod son soy spa spy sty sub sum sun tab tan tap tax ten tie tin tip toe ton toy try tub two use van vat vet vow was wax way web wed wet who why wig win wit woe won yes yet you zip zoo able acid area army away back bake ball band bank barn base bath bean bear beat been bell belt bend best bird blue boat body bold bolt born both bowl buck burn bush busy cage cake calm camp card care case chin chip city clay club coal coat code coin cold come cool cope cord corn crib crop cure curl cute dark dart data date dawn days dead deal debt deck deep deer dent desk dial diet dirt dish dock does drag draw drip drop drug drum dual duck dull dune dusk dust duty each ease easy edge envy epic even ever evil exam exit fact fade fail fair fake fall fame farm fate fear feed feel feet fell felt fern file fill film find fire firm fish fist flat flip flow foam fold folk fond fool ford fork form fort four free from fuel full fund fury fuse gain gale game gang gate gaze gear gene gift girl give glow glue goal goat gold golf gown grab gray grew grid grim grin grip grow gulf gust hair half hall halt hand hang hard harm have hawk haze head heal heap heel heir held hell helm help herb herd here hero high hill hint hire hive hold holy home hood hoof horn hour hunt hurl hurt hush icon idea idle inch into iris iron item jade jazz jean jeep join jolt jump junk jury just keen keep kept kick kind kiss knee knew knit know lack lady lake lamb lamp land late lava lawn lead leaf leak lean leap left lend lens less lick life lift like lily lion list live load loan lock loft logo long loop lord loss loud love luck lump lung lure lush made mail main make male mall mane many maps mark mask mass mate math maze meal mean meat meet melt mend menu mesh mess mild mile milk mill mind miss mist mode mold monk moss moth move much mule must myth nail name navy neat neck need nest news next node norm note noun nuts oath obey odor once only onto open oral over pack page paid pain pair pale palm pane park pass path peak pear peel peer pest pick pier pile pill pine pint pipe plan play plot plow plug plum plus poem poet pond pony pool poor pork port pour pray prey prop pull pulp pump punk pure push rack rage raid rail rain rank rare rays read real reef reel rest rich ride rift riot ripe rise risk road ro  catch kick block tackle score goal puck stick glove helmet brace splint gauze".split(" ");
const SEED_EXTRA = ["temple","statue","museum","gallery","theater","cinema","festival","carnival","parade","costume","mystery","riddle","puzzle","secret","wallet","ticket","luggage","passport","airport","station","subway","highway","tractor","pasture","stable","saddle","wagon","carriage","chariot","knight","shield","armor","kingdom","empire","emperor","prince","princess","palace","throne","crown","jewel","ruby","sapphire","amethyst","earring","sandal","slipper","carpet","cushion","whistle","badger","beaver","possum","raccoon","hedgehog","chipmunk","weasel","ferret","lizard","iguana","python","tortoise","walrus","salmon","lobster","shrimp","oyster","jellyfish","seaweed","anchor","rudder","harbor","voyage","cruise","sailboat","paddle","current","breeze","cyclone","typhoon","eclipse","asteroid","satellite","gravity","cosmos","nebula"];
SEED.push(...SEED_EXTRA);
const DICTIONARY = Array.from(new Set(SEED.concat(SUPPORT))).map(w=>w.toUpperCase());
const HINT_BASE_COST = 15;
function getHintCost(){ return HINT_BASE_COST + Math.floor((state.totalEarned||0)/50)*5; }
function earnCoins(amount){ state.coins += amount; state.totalEarned = (state.totalEarned||0) + amount; }
const PRAISE = ["Excellent!","Great job!","Nice one!","Well done!","Awesome!","Wonderful!","You got it!","Terrific!","Fantastic!","Nicely done!"];
const BONUS_PRAISE = ["Bonus word!","Nice find!","Sharp eyes!","Extra word!","Great spot!"];

function letterCounts(word){ const c={}; for(const ch of word) c[ch]=(c[ch]||0)+1; return c; }
function wordFits(word, counts){ const c={...counts}; for(const ch of word){ if(!c[ch]) return false; c[ch]--; } return true; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let MP = { enabled:false, db:null, myId:null, myName:null, roomId:null, _roomListener:null, _pendingReq:null, roomDifficulty:null, roomLevelNum:0, puzzleId:null };
let state = { difficulty:'easy', levelNum:0, coins:20, totalEarned:0, level:null, found:[], bonus:[], hinted:[], skin:'garden', ownedSkins:['garden'] };
function curDifficulty(){ return (MP.roomId && MP.roomDifficulty) ? MP.roomDifficulty : state.difficulty; }
function curLevelNum(){ return MP.roomId ? (MP.roomLevelNum||0) : state.levelNum; }
function syncDiffButtons(){ const d=curDifficulty(); document.querySelectorAll('#diffrow button').forEach(b=>b.classList.toggle('active', b.dataset.d===d)); }
function saveState(){ try{ localStorage.setItem('word-garden-state', JSON.stringify(state)); }catch(e){} }
function loadState(){ try{ const raw=localStorage.getItem('word-garden-state'); if(raw){ const p=JSON.parse(raw); if(p && p.difficulty) state=Object.assign(state,p); } }catch(e){} }

function pickSeed(minLen,maxLen){
  const c = SEED.filter(w=>w.length>=minLen && w.length<=maxLen);
  return (c.length? c : SEED)[Math.floor(Math.random()*(c.length||SEED.length))];
}

function generateLevel(diff, lvlNum){
  diff = diff || curDifficulty();
  if(lvlNum==null) lvlNum = curLevelNum();
  const bump = Math.floor(lvlNum/4);
  let minLen,maxLen;
  if(diff==='easy'){ minLen=6; maxLen=Math.min(6+bump,7); }
  else if(diff==='medium'){ minLen=7; maxLen=Math.min(7+bump,8); }
  else { minLen=8; maxLen=Math.min(8+bump,9); }
  let seed, matches, connected, tries=0;
  do{
    seed = pickSeed(minLen,maxLen).toUpperCase();
    const counts = letterCounts(seed);
    matches = Array.from(new Set(DICTIONARY.filter(w=> w.length>=3 && w.length<=seed.length && wordFits(w,counts))));
    if(!matches.includes(seed)) matches.push(seed);
    matches.sort((a,b)=> b.length-a.length);
    let candidate = matches.slice(0,8);
    if(!candidate.includes(seed)){ candidate[candidate.length-1]=seed; }
    candidate = Array.from(new Set(candidate));
    connected = layoutWords(candidate).map(p=>p.word);
    tries++;
  } while(connected.length<4 && tries<15);
  return { letters: shuffle(seed.split('')), words: connected };
}

function layoutWords(words){
  const sorted = [...words].sort((a,b)=>b.length-a.length);
  const grid = {}; const placements = [];
  function canPlace(word,row,col,dir){
    for(let i=0;i<word.length;i++){
      const r = dir==='V'? row+i:row; const c = dir==='H'? col+i:col;
      const key=r+','+c;
      if(grid[key]){
        if(grid[key]!==word[i]) return false;
      } else {
        if(dir==='H'){
          if(grid[(r-1)+','+c] || grid[(r+1)+','+c]) return false;
        } else {
          if(grid[r+','+(c-1)] || grid[r+','+(c+1)]) return false;
        }
      }
    }
    if(dir==='H'){
      if(grid[row+','+(col-1)] || grid[row+','+(col+word.length)]) return false;
    } else {
      if(grid[(row-1)+','+col] || grid[(row+word.length)+','+col]) return false;
    }
    return true;
  }
  function place(word,row,col,dir){
    for(let i=0;i<word.length;i++){
      const r = dir==='V'? row+i:row; const c = dir==='H'? col+i:col;
      grid[r+','+c]=word[i];
    }
    placements.push({word,row,col,dir});
  }
  sorted.forEach((word,idx)=>{
    if(idx===0){ place(word,0,0,'H'); return; }
    let placed=false;
    outer:
    for(let i=0;i<word.length && !placed;i++){
      const ch=word[i];
      for(const key in grid){
        if(grid[key]!==ch) continue;
        const [gr,gc]=key.split(',').map(Number);
        let row=gr-i, col=gc;
        if(canPlace(word,row,col,'V')){ place(word,row,col,'V'); placed=true; break outer; }
        row=gr; col=gc-i;
        if(canPlace(word,row,col,'H')){ place(word,row,col,'H'); placed=true; break outer; }
      }
    }
    if(!placed){
      // word couldn't cross into the puzzle cleanly \u2014 leave it out of the grid entirely
      // (it stays a valid dictionary word, so it's still findable as a bonus word)
    }
  });
  return placements;
}

let level, placements, wordToPlacement, revealed, found, bonusFound, hintedCells, letters, centers, dragging=false, path=[];

function startLevel(levelData, foundArr, bonusArr, hintedArr){
  level = levelData;
  placements = layoutWords(level.words);
  wordToPlacement = {}; placements.forEach(p=> wordToPlacement[p.word]=p);
  letters = level.letters;
  found = new Set(foundArr||[]);
  bonusFound = new Set(bonusArr||[]);
  hintedCells = new Set(hintedArr||[]);
  revealed = new Set();
  found.forEach(w=>{ const p = wordToPlacement[w]; if(p){ for(let i=0;i<p.word.length;i++){ const r=p.dir==='V'?p.row+i:p.row; const c=p.dir==='H'?p.col+i:p.col; revealed.add(r+','+c); } } });
  renderGrid(); renderWheel(); renderProgress(); renderBonus(); renderCoins(); updateHintState(); setMessage(''); syncDiffButtons();
}

function viewportSize(){
  const vv = window.visualViewport;
  return { w: (vv && vv.width) || window.innerWidth, h: (vv && vv.height) || window.innerHeight };
}
function spaceUsedBy(excludeId){
  const app = document.querySelector('.app');
  const appCS = getComputedStyle(app);
  let used = parseFloat(appCS.paddingTop)||0;
  used += parseFloat(appCS.paddingBottom)||0;
  Array.from(app.children).forEach(child=>{
    if(child.id === excludeId) return;
    const cs = getComputedStyle(child);
    used += child.getBoundingClientRect().height + (parseFloat(cs.marginTop)||0) + (parseFloat(cs.marginBottom)||0);
  });
  return used;
}

function renderGrid(justKey){
  let minR=Infinity,maxR=-Infinity,minC=Infinity,maxC=-Infinity;
  const cells={};
  placements.forEach(p=>{
    for(let i=0;i<p.word.length;i++){
      const r = p.dir==='V'? p.row+i:p.row; const c = p.dir==='H'? p.col+i:p.col;
      minR=Math.min(minR,r); maxR=Math.max(maxR,r); minC=Math.min(minC,c); maxC=Math.max(maxC,c);
      cells[r+','+c]=p.word[i];
    }
  });
  const grid = document.getElementById('grid');
  const cols = maxC-minC+1, rows = maxR-minR+1;
  const appMaxWidth = 480;
  const { w: vw, h: vh } = viewportSize();
  const availW = Math.min(vw, appMaxWidth) - 56;
  const reserveForWheel = 200;
  const availH = Math.min(Math.max(vh - spaceUsedBy('gridwrap') - reserveForWheel, 100), 320);
  const gap = 4;
  let cellSize = Math.floor(Math.min((availW - gap*(cols-1))/cols, (availH - gap*(rows-1))/rows, 48));
  cellSize = Math.max(cellSize, 18);
  const fontSize = Math.max(12, Math.floor(cellSize*0.5));
  grid.style.gap = gap+'px';
  grid.style.gridTemplateColumns = `repeat(${cols}, ${cellSize}px)`;
  grid.style.gridTemplateRows = `repeat(${rows}, ${cellSize}px)`;
  grid.innerHTML = '';
  Object.keys(cells).forEach(key=>{
    const [r,c] = key.split(',').map(Number);
    const div = document.createElement('div');
    const isRevealed = revealed.has(key);
    const isHinted = !isRevealed && hintedCells.has(key);
    div.className = 'cell' + (isRevealed ? ' revealed' : '') + (isHinted ? ' hinted' : '') + (key===justKey ? ' pop' : '');
    div.textContent = (isRevealed || isHinted) ? cells[key] : '';
    div.style.width = cellSize+'px';
    div.style.height = cellSize+'px';
    div.style.fontSize = fontSize+'px';
    div.style.gridColumn = (c-minC+1);
    div.style.gridRow = (r-minR+1);
    grid.appendChild(div);
  });
}

function renderWheel(){
  const box = document.getElementById('wheelbox');
  const inner = document.getElementById('wheelInner');
  inner.querySelectorAll('.letter').forEach(n=>n.remove());
  const n = letters.length;
  const { w: vw, h: vh } = viewportSize();
  const availH = Math.max(vh - spaceUsedBy('wheelbox'), 140);
  const boxSize = Math.max(180, Math.min(vw - 40, 300, 480-72, availH));
  box.style.width = boxSize+'px';
  box.style.height = boxSize+'px';
  const center = boxSize/2;
  const edgeMargin = 6;
  let circleSize = 60;
  let radius = center - circleSize/2 - edgeMargin;
  const chord = 2*radius*Math.sin(Math.PI/n);
  circleSize = Math.max(38, Math.min(60, Math.floor(chord - 6)));
  radius = center - circleSize/2 - edgeMargin;
  const fontSize = Math.max(15, Math.floor(circleSize*0.4));
  centers = [];
  letters.forEach((ch,i)=>{
    const btn = document.createElement('div');
    btn.className='letter'; btn.textContent = ch; btn.dataset.index=i;
    btn.style.width = circleSize+'px'; btn.style.height = circleSize+'px'; btn.style.fontSize = fontSize+'px';
    const angle = (2*Math.PI*i/n) - Math.PI/2;
    const x = center + radius*Math.cos(angle) - circleSize/2;
    const y = center + radius*Math.sin(angle) - circleSize/2;
    btn.style.left = x+'px'; btn.style.top = y+'px';
    centers.push({x:x+circleSize/2, y:y+circleSize/2});
    inner.appendChild(btn);
  });
}

function updatePoly(){
  const poly = document.getElementById('poly');
  poly.setAttribute('points', path.map(i=>centers[i].x+','+centers[i].y).join(' '));
  poly.setAttribute('stroke', getComputedStyle(document.body).getPropertyValue('--coral'));
}
function clearPoly(){ document.getElementById('poly').setAttribute('points',''); }

function nodeAt(x,y){
  const el = document.elementFromPoint(x,y);
  return el && el.classList.contains('letter') ? el : null;
}
function onDown(e){
  const p = e.touches ? e.touches[0] : e;
  const el = nodeAt(p.clientX,p.clientY);
  if(!el) return;
  dragging = true; path = [parseInt(el.dataset.index)];
  el.classList.add('active'); updatePoly();
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
}
function onMove(e){
  if(!dragging) return;
  const el = nodeAt(e.clientX,e.clientY);
  if(el){
    const idx = parseInt(el.dataset.index);
    if(!path.includes(idx)){ path.push(idx); el.classList.add('active'); updatePoly(); }
  }
}
function onUp(){
  if(!dragging) return;
  dragging=false;
  window.removeEventListener('pointermove', onMove);
  window.removeEventListener('pointerup', onUp);
  const word = path.map(i=>letters[i]).join('');
  submitWord(word);
  document.querySelectorAll('.letter.active').forEach(n=>n.classList.remove('active'));
  path=[]; clearPoly();
}
document.getElementById('wheelbox').addEventListener('pointerdown', onDown);

function awardForCompletion(){
  const diffMult = curDifficulty()==='hard' ? 1.6 : (curDifficulty()==='medium' ? 1.3 : 1);
  const reward = Math.round((10 + curLevelNum()*2) * diffMult);
  state.coins += reward;
  state.totalEarned = (state.totalEarned||0) + reward;
  return reward;
}

function revealWordAnimated(word, onDone){
  const p = wordToPlacement[word];
  const cellsList = [];
  if(p){ for(let i=0;i<p.word.length;i++){ const r=p.dir==='V'?p.row+i:p.row; const c=p.dir==='H'?p.col+i:p.col; cellsList.push(r+','+c); } }
  let idx = 0;
  function step(){
    if(idx < cellsList.length){
      const key = cellsList[idx];
      revealed.add(key);
      hintedCells.delete(key);
      renderGrid(key);
      idx++;
      setTimeout(step, 110);
    } else if(onDone){ onDone(); }
  }
  if(cellsList.length){ step(); } else if(onDone){ onDone(); }
}

function syncProgress(extra){
  if(MP.roomId){
    const upd = { found: Array.from(found), bonus: Array.from(bonusFound), hinted: Array.from(hintedCells) };
    if(extra) Object.assign(upd, extra);
    MP.db.ref('rooms/'+MP.roomId).update(upd);
  } else {
    state.found = Array.from(found); state.bonus = Array.from(bonusFound); state.hinted = Array.from(hintedCells);
    saveState();
  }
}

function submitWord(word){
  if(word.length<3) return;
  if(level.words.includes(word)){
    if(!found.has(word)){
      found.add(word);
      const coinsEarned = word.length;
      earnCoins(coinsEarned);
      const praise = PRAISE[Math.floor(Math.random()*PRAISE.length)];
      setMessage(praise+' Found '+word+' (+'+coinsEarned+' \ud83e\ude99)');
      renderProgress(); updateHintState(); renderCoins();
      syncProgress({ ['foundBy/'+word]: (MP.myName||'Your partner') });
      revealWordAnimated(word, ()=>{
        if(found.size===level.words.length){
          const reward = awardForCompletion();
          saveState(); renderCoins();
          setTimeout(()=>showComplete(reward),400);
        }
      });
    } else { setMessage('Already found that one'); }
  } else if(DICTIONARY.includes(word) && wordFits(word, letterCounts(letters.join('')))){
    if(!bonusFound.has(word)){
      bonusFound.add(word);
      const coinsEarned = word.length;
      earnCoins(coinsEarned);
      const praise = BONUS_PRAISE[Math.floor(Math.random()*BONUS_PRAISE.length)];
      setMessage(praise+' '+word+' (+'+coinsEarned+' \ud83e\ude99)');
      renderBonus(); renderCoins();
      syncProgress({ ['bonusBy/'+word]: (MP.myName||'Your partner') });
    }
    else setMessage('Already found that one');
  } else {
    setMessage('Not in the word list');
  }
}

function useHint(){
  if(document.getElementById('hintBtn').classList.contains('disabled')) return;
  const remaining = level.words.filter(w=>!found.has(w));
  if(remaining.length===0) return;
  const cost = getHintCost();
  if(state.coins < cost){
    document.getElementById('coinOverlayText').textContent = 'You need '+cost+' \ud83e\ude99 for a hint \u2014 you have '+state.coins+'.';
    document.getElementById('coinOverlay').classList.remove('hidden');
    return;
  }
  remaining.sort((a,b)=>a.length-b.length);
  let target=null, unhinted=null;
  for(const w of remaining){
    const p = wordToPlacement[w];
    if(!p) continue;
    const cellsForWord = [];
    for(let i=0;i<p.word.length;i++){ const r=p.dir==='V'?p.row+i:p.row; const c=p.dir==='H'?p.col+i:p.col; cellsForWord.push(r+','+c); }
    const remainCells = cellsForWord.filter(k=>!hintedCells.has(k) && !revealed.has(k));
    if(remainCells.length){ target=w; unhinted=remainCells; break; }
  }
  if(!target){ setMessage('Every remaining word is already hinted'); return; }
  state.coins -= cost;
  const numToReveal = target.length>=6 ? 2 : 1;
  const toReveal = unhinted.slice(0, numToReveal);
  toReveal.forEach(k=> hintedCells.add(k));
  setMessage('Hint: '+numToReveal+' letter'+(numToReveal>1?'s':'')+' in a '+target.length+'-letter word (-'+cost+' \ud83e\ude99)');
  renderGrid(); renderCoins(); updateHintState();
  syncProgress();
}

document.getElementById('pickCancel').addEventListener('click', ()=>{ document.getElementById('pickOverlay').classList.add('hidden'); });

function mpSendRequest(target){
  MP.db.ref('requests/'+target.id).set({ from: MP.myId, fromName: MP.myName, ts: Date.now(), difficulty: curDifficulty(), levelNum: curLevelNum() });
  setMpStatus('Request sent to '+target.name+'\u2026');
}

document.getElementById('reqAccept').addEventListener('click', ()=>{
  document.getElementById('requestOverlay').classList.add('hidden');
  const req = MP._pendingReq;
  if(!req) return;
  const roomId = [MP.myId, req.from].sort().join('_');
  const roomRef = MP.db.ref('rooms/'+roomId);
  roomRef.once('value', snap=>{
    const existing = snap.val();
    const players = { [MP.myId]: MP.myName, [req.from]: req.fromName };
    if(existing && existing.puzzle){
      roomRef.update({ players: players, updatedAt: Date.now() }); // restore the saved session
    } else {
      const diff = req.difficulty || 'easy', ln = req.levelNum || 0;
      const lvl = generateLevel(diff, ln);
      roomRef.set({ puzzle: { letters: lvl.letters, words: lvl.words }, puzzleId: 'p'+Date.now(), difficulty: diff, levelNum: ln, players: players, updatedAt: Date.now() });
    }
    MP.db.ref('playerRoom/'+MP.myId).set(roomId);
    MP.db.ref('playerRoom/'+req.from).set(roomId);
    MP.db.ref('requests/'+MP.myId).remove();
  });
});
document.getElementById('reqDecline').addEventListener('click', ()=>{
  document.getElementById('requestOverlay').classList.add('hidden');
  MP.db.ref('requests/'+MP.myId).remove();
});

function mpJoinRoom(roomId){
  MP.roomId = roomId;
  MP.puzzleId = null;
  document.getElementById('leaveRoomBtn').classList.remove('hidden');
  document.getElementById('chatToggle').classList.remove('hidden');
  document.getElementById('chatMessages').innerHTML = '';
  if(MP._roomListener) MP._roomListener();
  const puzzleRef = MP.db.ref('rooms/'+roomId);
  const handler = snap=>{
    const val = snap.val();
    if(!val || !val.puzzle) return;
    MP.roomDifficulty = val.difficulty || 'easy';
    MP.roomLevelNum = val.levelNum || 0;
    const foundArr = val.found||[], bonusArr = val.bonus||[], hintedArr = val.hinted||[];
    const pid = val.puzzleId || ((val.puzzle.letters||[]).join('')+'|'+(val.puzzle.words||[]).join(','));
    if(pid !== MP.puzzleId){
      MP.puzzleId = pid;
      document.getElementById('overlay').classList.add('hidden');
      startLevel({ letters: val.puzzle.letters, words: val.puzzle.words }, foundArr, bonusArr, hintedArr);
      if(level.words.length && found.size >= level.words.length) setMessage('All done here \u2014 tap + for a new puzzle');
      return;
    }
    syncDiffButtons(); renderProgress();
    const newBonus = bonusArr.filter(w=>!bonusFound.has(w));
    if(newBonus.length){
      newBonus.forEach(w=>bonusFound.add(w));
      setMessage(((val.bonusBy||{})[newBonus[0]]||'Your partner')+' found bonus word '+newBonus[0]+'!');
      renderBonus();
    }
    const newFound = foundArr.filter(w=>!found.has(w));
    const doneCells = cellsOfWords(foundArr);
    const nh = new Set(hintedArr.filter(k=>!doneCells.has(k) && !revealed.has(k)));
    const hintChanged = nh.size !== hintedCells.size || Array.from(nh).some(k=>!hintedCells.has(k));
    if(hintChanged) hintedCells = nh;
    if(newFound.length){
      const queue = newFound.slice();
      newFound.forEach(w=>found.add(w));
      setMessage('\ud83c\udf89 '+((val.foundBy||{})[newFound[0]]||'Your partner')+' found '+newFound[0]+'!');
      renderProgress(); updateHintState();
      (function next(){ const w = queue.shift(); if(!w){ finishIfComplete(); return; } revealWordAnimated(w, next); })();
    } else if(hintChanged){ renderGrid(); }
  };
  puzzleRef.on('value', handler);
  let chatReady = false;
  const chatRef = MP.db.ref('rooms/'+roomId+'/chat').limitToLast(50);
  chatRef.on('child_added', snap=> mpAppendChat(snap.val(), chatReady));
  setTimeout(()=>{ chatReady = true; }, 600);
  MP._roomListener = ()=>{ puzzleRef.off('value', handler); chatRef.off('child_added'); };
  setMpStatus('Playing together \ud83c\udf89');
}

function mpLeaveRoomLocal(){
  MP.roomId = null; MP.roomDifficulty = null; MP.roomLevelNum = 0; MP.puzzleId = null;
  document.getElementById('overlay').classList.add('hidden');
  document.getElementById('leaveRoomBtn').classList.add('hidden');
  document.getElementById('chatToggle').classList.add('hidden');
  document.getElementById('chatPanel').classList.add('hidden');
  document.getElementById('chatMessages').innerHTML = '';
  if(MP._roomListener){ MP._roomListener(); MP._roomListener=null; }
  setMpStatus('');
  if(state.level && state.level.letters && state.level.words){
    startLevel({letters:state.level.letters, words:state.level.words}, state.found, state.bonus, state.hinted);
  } else { newPuzzle(); }
}
document.getElementById('leaveRoomBtn').addEventListener('click', ()=>{
  const roomId = MP.roomId;
  if(!roomId) return;
  MP.db.ref('rooms/'+roomId+'/players').once('value', snap=>{
    const players = snap.val() || {};
    const ids = Object.keys(players).length ? Object.keys(players) : [MP.myId];
    ids.forEach(pid=> MP.db.ref('playerRoom/'+pid).remove()); // room data stays so you can pick up where you left off
  });
});

document.getElementById('chatToggle').addEventListener('click', ()=>{
  document.getElementById('chatPanel').classList.toggle('hidden');
});
function mpSendChat(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text || !MP.roomId) return;
  MP.db.ref('rooms/'+MP.roomId+'/chat').push({ name: MP.myName, text: text.slice(0,200), ts: Date.now() });
  input.value = '';
}
document.getElementById('chatSend').addEventListener('click', mpSendChat);
document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') mpSendChat(); });
function mpAppendChat(msg, autoOpen){
  if(!msg) return;
  if(autoOpen) document.getElementById('chatPanel').classList.remove('hidden');
  const div = document.createElement('div');
  div.className = 'chatLine';
  div.innerHTML = '<b>'+escapeHtml(msg.name)+':</b> '+escapeHtml(msg.text);
  const box = document.getElementById('chatMessages');
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

mpInit();
</script>
